<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday TV Display</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  text-align:center;
  background:
    radial-gradient(circle at 30% 20%,#4a9b8e 0%,#2d6e7e 35%,#1a3f5c 70%,#0f2a44 100%);
}

.container{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:20px;
  position:relative;
  z-index:5;
}

.logo{
  position:fixed;
  top:20px;
  left:25px;
  height:60px;
  z-index:20;
}

.logo img{
  height:100%;
  max-width:200px;
  object-fit:contain;
}

.title{
  font-size:clamp(30px,5vw,80px);
  font-weight:bold;
  line-height:1.05;
  text-shadow:0 5px 15px rgba(0,0,0,.3);
  animation:bounce 2s infinite;
}

.subtitle{
  font-size:clamp(18px,2.4vw,34px);
}

.date{
  font-size:clamp(15px,1.8vw,26px);
  font-weight:bold;
}

.photo-wrap{
  width:min(42vw,55vh,520px);
  height:min(42vw,55vh,520px);
  min-width:220px;
  min-height:220px;

  background:#fff;
  padding:8px;

  border-radius:18px;

  box-shadow:
    0 0 35px rgba(255,255,255,.8),
    0 18px 45px rgba(0,0,0,.35);

  overflow:hidden;

  animation:glow 2s infinite alternate;
}

.photo-inner{
  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:12px;

  display:none;
  background:#1f5b6d;
}

.fallback{
  width:100%;
  height:100%;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:clamp(60px,9vw,140px);
  font-weight:bold;

  background:rgba(255,255,255,.18);
}

.name{
  max-width:90vw;

  font-size:clamp(28px,4.5vw,68px);
  font-weight:bold;

  line-height:1.05;

  text-shadow:0 4px 10px rgba(0,0,0,.25);
}

.department{
  font-size:clamp(16px,2.2vw,30px);
  opacity:.9;
}

.message{
  max-width:min(1000px,90vw);

  font-size:clamp(14px,1.8vw,28px);
  line-height:1.3;

  background:rgba(255,255,255,.15);

  padding:12px 25px;

  border-radius:25px;

  backdrop-filter:blur(8px);

  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.confetti{
  position:fixed;
  top:-20px;
  width:10px;
  height:18px;
  opacity:.9;

  animation:fall 4s linear infinite;

  z-index:1;
}

.balloon{
  position:fixed;
  bottom:-100px;
  font-size:50px;

  animation:floatUp 10s linear infinite;

  z-index:1;
}

@keyframes bounce{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }
}

@keyframes glow{
  from{
    box-shadow:
      0 0 20px rgba(255,255,255,.6),
      0 15px 40px rgba(0,0,0,.3);
  }

  to{
    box-shadow:
      0 0 45px rgba(255,255,255,1),
      0 15px 40px rgba(0,0,0,.3);
  }
}

@keyframes fall{
  0%{
    transform:translateY(-30px) rotate(0);
  }

  100%{
    transform:translateY(110vh) rotate(360deg);
  }
}

@keyframes floatUp{
  0%{
    transform:translateY(0);
    opacity:.9;
  }

  100%{
    transform:translateY(-120vh);
    opacity:0;
  }
}

@media(max-height:700px){

  .container{
    gap:6px;
    padding:10px;
  }

  .logo{
    top:10px;
    left:15px;
    height:40px;
  }

  .photo-wrap{
    width:min(32vw,38vh,330px);
    height:min(32vw,38vh,330px);
    min-width:180px;
    min-height:180px;
  }

  .title{
    font-size:clamp(25px,4vw,55px);
  }

  .name{
    font-size:clamp(24px,3.8vw,50px);
  }

  .message{
    font-size:clamp(12px,1.5vw,20px);
    padding:7px 15px;
  }
}

@media(max-width:600px){

  .container{
    padding:60px 10px 10px;
  }

  .photo-wrap{
    width:min(65vw,38vh);
    height:min(65vw,38vh);
  }

  .title{
    font-size:9vw;
  }

  .name{
    font-size:8vw;
  }
}
</style>
</head>

/* =========================================================
   INITIALS
   ========================================================= */

function initials(name){

  return String(name || "Employee")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();

}


/* =========================================================
   AUTOMATIC PHOTO LOADER
   ========================================================= */

function loadEmployeePhoto(employeeName){

  const img =
    document.getElementById("employeePhoto");

  const fallback =
    document.getElementById("fallback");

  // Hide everything first
  img.style.display = "none";
  fallback.style.display = "flex";

  img.removeAttribute("src");

  /*
    Automatically searches these filenames:

    Achyut Sirsat.jpg
    Achyut Sirsat.jpeg
    Achyut Sirsat.png
    Achyut Sirsat.webp

    It checks the GitHub repository root first.

    Then it checks:

    photos/Achyut Sirsat.jpg
    photos/Achyut Sirsat.jpeg
    photos/Achyut Sirsat.png
    photos/Achyut Sirsat.webp
  */

  const extensions = [
    ".jpg",
    ".jpeg",
    ".png",
    ".webp"
  ];

  const candidates = [];

  extensions.forEach(ext => {

    candidates.push(
      "./" +
      encodeURIComponent(employeeName) +
      ext
    );

  });

  extensions.forEach(ext => {

    candidates.push(
      "./photos/" +
      encodeURIComponent(employeeName) +
      ext
    );

  });


  let index = 0;


  function tryNext(){

    if(index >= candidates.length){

      console.log(
        "No photo found for:",
        employeeName
      );

      img.style.display = "none";
      fallback.style.display = "flex";

      return;
    }


    const imageURL = candidates[index];

    index++;


    console.log(
      "Trying employee photo:",
      imageURL
    );


    img.onload = function(){

      console.log(
        "PHOTO FOUND:",
        imageURL
      );

      img.style.display = "block";
      fallback.style.display = "none";

    };


    img.onerror = function(){

      console.log(
        "Photo not found:",
        imageURL
      );

      tryNext();

    };


    img.src = imageURL;

  }


  tryNext();

}


/* =========================================================
   SHOW EMPLOYEE
   ========================================================= */

function showEmployee(employee,isToday){

  const title =
    document.getElementById("birthdayTitle");

  const subtitle =
    document.getElementById("birthdaySubtitle");

  const name =
    document.getElementById("employeeName");

  const department =
    document.getElementById("department");

  const date =
    document.getElementById("birthdayDate");

  const fallback =
    document.getElementById("fallback");


  if(isToday){

    title.textContent =
      "🎉 HAPPY BIRTHDAY! 🎉";

    subtitle.textContent =
      "Wishing you a wonderful day!";

  }else{

    title.textContent =
      "🎊 COMING BIRTHDAY 🎊";

    subtitle.textContent =
      "";

  }


  name.textContent =
    employee.name || "Employee";


  department.textContent =
    employee.department || "";


  if(employee.day && employee.month){

    const year =
      new Date().getFullYear();

    const birthday =
      new Date(
        year,
        Number(employee.month)-1,
        Number(employee.day)
      );


    date.textContent =
      "Birthday: " +
      birthday.toLocaleDateString(
        "en-IN",
        {
          day:"2-digit",
          month:"long",
          year:"numeric"
        }
      );

  }else{

    date.textContent = "";

  }


  fallback.textContent =
    initials(employee.name);


  /*
    THIS IS THE IMPORTANT PART.

    Employee:
      Achyut Sirsat

    Automatically searches:
      Achyut Sirsat.jpg
  */

  loadEmployeePhoto(
    String(employee.name || "").trim()
  );

}


/* =========================================================
   BIRTHDAY SYSTEM
   ========================================================= */

function startBirthdayDisplay(){

  const now =
    new Date();

  const currentMonth =
    now.getMonth() + 1;

  const today =
    now.getDate();


  /*
    Get employees for current month
  */

  const monthly =
    employees
      .filter(employee =>
        Number(employee.month) === currentMonth
      )
      .sort((a,b) =>
        Number(a.day) - Number(b.day)
      );


  /*
    Today's birthdays
  */

  const todays =
    monthly.filter(employee =>
      Number(employee.day) === today
    );


  /*
    Upcoming birthdays
  */

  const upcoming =
    monthly.filter(employee =>
      Number(employee.day) > today
    );


  /*
    Today first.
    Then upcoming birthdays.
  */

  const queue = [

    ...todays.map(employee => ({
      employee:employee,
      today:true
    })),

    ...upcoming.map(employee => ({
      employee:employee,
      today:false
    }))

  ];


  /*
    No birthdays remaining this month
  */

  if(queue.length === 0){

    document.getElementById(
      "birthdayTitle"
    ).textContent =
      "🎂 NO UPCOMING BIRTHDAYS 🎂";

    document.getElementById(
      "birthdaySubtitle"
    ).textContent =
      "Have a wonderful day!";

    document.getElementById(
      "employeeName"
    ).textContent = "";

    document.getElementById(
      "department"
    ).textContent = "";

    document.getElementById(
      "birthdayDate"
    ).textContent = "";

    document.getElementById(
      "employeePhoto"
    ).style.display = "none";

    document.getElementById(
      "fallback"
    ).style.display = "flex";

    return;
  }


  let currentIndex = 0;


  function displayNext(){

    const item =
      queue[currentIndex];


    showEmployee(
      item.employee,
      item.today
    );


    currentIndex =
      (currentIndex + 1) % queue.length;

  }


  /*
    Show immediately
  */

  displayNext();


  /*
    Change employee every 10 seconds
  */

  setInterval(
    displayNext,
    10000
  );

}


/* =========================================================
   START
   ========================================================= */

startBirthdayDisplay();


/* =========================================================
   AUTOMATIC MIDNIGHT REFRESH
   ========================================================= */

let lastDate =
  new Date().toDateString();


setInterval(function(){

  const currentDate =
    new Date().toDateString();


  if(currentDate !== lastDate){

    window.location.reload();

  }

},30000);


/*
   Extra midnight protection
*/

function scheduleMidnightRefresh(){

  const now =
    new Date();


  const midnight =
    new Date(now);


  midnight.setHours(
    24,
    0,
    2,
    0
  );


  const delay =
    midnight.getTime() -
    now.getTime();


  setTimeout(
    function(){
      window.location.reload();
    },
    delay
  );

}


scheduleMidnightRefresh();

</script>
