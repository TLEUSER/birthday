<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>TLE Birthday TV - Monthly Auto Display</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#07152d;font-family:Arial,Helvetica,sans-serif}
body{width:100vw;height:100vh}
.screen{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 18%,rgba(0,220,255,.28),transparent 32%),radial-gradient(circle at 85% 78%,rgba(190,45,255,.25),transparent 34%),linear-gradient(135deg,#061326 0%,#0d3157 50%,#180a31 100%)}
.screen:before{content:"";position:absolute;inset:-40%;background:linear-gradient(120deg,transparent 42%,rgba(255,255,255,.045) 50%,transparent 58%);transform:rotate(-10deg);animation:shine 10s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,100%{transform:translateX(-8%) rotate(-10deg)}50%{transform:translateX(8%) rotate(-10deg)}}

/* Soft animated background glow effect */
.screen:after{
    content:"";
    position:absolute;
    inset:-20%;
    z-index:1;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 30%,rgba(0,220,255,.16),transparent 18%),
        radial-gradient(circle at 80% 25%,rgba(255,60,172,.13),transparent 20%),
        radial-gradient(circle at 50% 85%,rgba(255,209,102,.10),transparent 22%);
    filter:blur(18px);
    animation:ambientGlow 12s ease-in-out infinite alternate;
}
@keyframes ambientGlow{
    0%{transform:scale(1) rotate(0deg);opacity:.65}
    50%{transform:scale(1.08) rotate(2deg);opacity:1}
    100%{transform:scale(1.02) rotate(-2deg);opacity:.72}
}

/* Floating light particles */
.bg-particle{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    z-index:2;
    pointer-events:none;
    background:rgba(255,255,255,.65);
    box-shadow:0 0 12px rgba(255,255,255,.65);
    animation:particleFloat linear infinite;
}
@keyframes particleFloat{
    0%{transform:translate3d(0,12vh,0) scale(.65);opacity:0}
    15%{opacity:.8}
    50%{transform:translate3d(18px,-8vh,0) scale(1);opacity:.9}
    85%{opacity:.45}
    100%{transform:translate3d(-12px,-28vh,0) scale(.45);opacity:0}
}

.logo{position:absolute;top:2.8vh;left:3vw;z-index:20;color:#fff;font-weight:900;letter-spacing:2px;font-size:clamp(15px,1.8vw,30px)}
.logo span{color:#00dcff}

.main{width:94vw;height:90vh;height:90dvh;display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,85px);position:relative;z-index:10;padding-top:2vh}

.photo-frame{flex:0 1 auto;width:min(42vw,68vh,620px);height:min(42vw,68vh,620px);min-width:180px;min-height:180px;max-width:46vw;max-height:68vh;padding:7px;border-radius:28px;background:linear-gradient(135deg,#00dcff,#744cff,#ff3cac);box-shadow:0 20px 65px rgba(0,0,0,.52),0 0 38px rgba(0,220,255,.18);overflow:hidden;display:flex;align-items:center;justify-content:center;transition:width .35s ease,height .35s ease}
.photo{width:100%;height:100%;display:block;object-fit:contain;object-position:center;border-radius:21px;background:#17283f;opacity:0;transform:scale(1);will-change:transform,opacity;transition:opacity .35s ease}
.photo.play{animation:slowZoom 55s ease-in-out infinite alternate}
@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.055)}}

.details{flex:0 1 48vw;max-width:730px;min-width:0;color:#fff}
.status{color:#ffd43b;font-weight:900;font-size:clamp(16px,3.3vw,54px);line-height:1;letter-spacing:clamp(1px,.3vw,5px);margin-bottom:18px;white-space:nowrap;overflow:hidden;text-overflow:clip;text-shadow:0 5px 25px rgba(255,196,0,.25)}
.name{font-size:clamp(18px,5.5vw,86px);line-height:.96;font-weight:900;text-transform:uppercase;overflow-wrap:normal;white-space:nowrap;overflow:hidden;text-overflow:clip;text-shadow:0 8px 30px rgba(0,0,0,.5);margin-bottom:15px}
.department{color:#72e7ff;font-size:clamp(14px,1.8vw,27px);font-weight:700;letter-spacing:2px;margin-bottom:18px}
.message{color:#dbe7f4;font-size:clamp(15px,1.7vw,26px);line-height:1.4;max-width:650px}
.date{display:inline-block;margin-top:23px;padding:10px 24px;border-radius:30px;color:#fff;font-size:clamp(14px,1.45vw,23px);font-weight:800;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10)}

.balloon{position:absolute;width:clamp(50px,5.8vw,96px);height:clamp(65px,7.7vw,126px);border-radius:50% 50% 47% 47%;z-index:4;pointer-events:none;box-shadow:inset -12px -16px 20px rgba(0,0,0,.25),inset 9px 8px 14px rgba(255,255,255,.45),0 10px 25px rgba(0,0,0,.25);animation:float 5s ease-in-out infinite}
.balloon:after{content:"";position:absolute;top:99%;left:50%;width:1px;height:100px;background:rgba(255,255,255,.55)}
.balloon:before{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:10px;height:10px;background:inherit;clip-path:polygon(0 0,100% 0,50% 100%)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(4deg)}}
.left1{left:1%;top:19%;background:radial-gradient(circle at 30% 22%,#fff 0 7%,#39d7ff 20%,#008cff 62%,#0054b8)}
.left2{left:4%;top:64%;background:radial-gradient(circle at 30% 22%,#fff 0 7%,#ff74d1 20%,#ef168d 62%,#99005a);animation-delay:1.2s}
.right1{right:1%;top:20%;background:radial-gradient(circle at 30% 22%,#fff 0 7%,#ff75ce 20%,#ff168e 62%,#a5005d);animation-delay:.7s}
.right2{right:4%;top:65%;background:radial-gradient(circle at 30% 22%,#fff 0 7%,#ffe47b 20%,#ffb000 62%,#d76500);animation-delay:1.8s}

.confetti{position:absolute;top:-25px;width:8px;height:15px;z-index:5;pointer-events:none;animation:fall 4.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.details.change{animation:detailsIn .55s ease}
@keyframes detailsIn{from{opacity:0;transform:translateX(35px)}to{opacity:1;transform:translateX(0)}}

@media(max-width:1100px){.main{gap:4vw}.photo-frame{max-width:43vw;max-height:62vh}}
@media(max-height:650px) and (orientation:landscape){
.main{height:92vh;gap:3vw;padding-top:1vh}.photo-frame{max-width:43vw;max-height:62vh}.status{font-size:clamp(20px,3vw,38px);margin-bottom:10px}.name{font-size:clamp(22px,5vw,62px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.department{margin-bottom:8px}.message{font-size:clamp(12px,1.5vw,20px)}.date{margin-top:12px}}
@media(max-width:700px){.status{font-size:clamp(16px,5.5vw,34px);white-space:nowrap}.name{font-size:clamp(18px,6.5vw,50px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{width:94vw;height:91vh;flex-direction:column;gap:2vh;padding-top:5vh}.photo-frame{width:min(62vw,40vh);height:min(62vw,40vh);max-width:72vw;max-height:42vh;min-width:150px;min-height:150px}.details{width:92vw;max-width:92vw;text-align:center}.status{font-size:clamp(22px,6vw,38px);margin-bottom:10px}.name{font-size:clamp(26px,7vw,50px)}.department{font-size:14px;margin-bottom:8px}.message{font-size:13px}.date{margin-top:12px;font-size:14px}.left2,.right2{display:none}}
@media(max-height:500px){.message{display:none}.main{gap:2vw}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* Classic background crackers - decorative only */
.cracker-layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.cracker{position:absolute;width:clamp(90px,12vw,180px);height:clamp(90px,12vw,180px);opacity:.72;filter:drop-shadow(0 0 8px rgba(255,214,80,.45));}
.cracker:before{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:#ffd166;transform:translate(-50%,-50%);box-shadow:0 0 18px 7px rgba(255,209,102,.45)}
.cracker i{position:absolute;left:50%;top:50%;width:2px;height:46%;transform-origin:50% 100%;background:linear-gradient(to top,rgba(255,255,255,.05),#ffd166,#ff5c5c);border-radius:3px}
.cracker i:nth-child(1){transform:translate(-50%,-100%) rotate(0deg)}
.cracker i:nth-child(2){transform:translate(-50%,-100%) rotate(45deg)}
.cracker i:nth-child(3){transform:translate(-50%,-100%) rotate(90deg)}
.cracker i:nth-child(4){transform:translate(-50%,-100%) rotate(135deg)}
.cracker i:nth-child(5){transform:translate(-50%,-100%) rotate(180deg)}
.cracker i:nth-child(6){transform:translate(-50%,-100%) rotate(225deg)}
.cracker i:nth-child(7){transform:translate(-50%,-100%) rotate(270deg)}
.cracker i:nth-child(8){transform:translate(-50%,-100%) rotate(315deg)}
.cracker{animation:crackerBurst 2.8s ease-in-out infinite}
.cracker.c1{left:2%;top:10%}
.cracker.c2{right:2%;top:12%;animation-delay:1.1s}
.cracker.c3{left:4%;bottom:7%;animation-delay:.55s;transform:scale(.72)}
.cracker.c4{right:4%;bottom:8%;animation-delay:1.65s;transform:scale(.72)}
@keyframes crackerBurst{
  0%,100%{opacity:.25;transform:scale(.55) rotate(0deg)}
  35%{opacity:.82;transform:scale(1) rotate(8deg)}
  55%{opacity:.95;transform:scale(1.08) rotate(-5deg)}
  75%{opacity:.35;transform:scale(.72) rotate(10deg)}
}
@media(max-width:700px){.status{font-size:clamp(16px,5.5vw,34px);white-space:nowrap}.name{font-size:clamp(18px,6.5vw,50px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cracker.c1,.cracker.c2{top:5%}
  .cracker.c3,.cracker.c4{bottom:3%}
}


/* ORIGINAL-STYLE CRACKER BLAST BACKGROUND */
.cracker-blast-layer{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    overflow:hidden;
}
.cracker-blast{
    position:absolute;
    width:clamp(100px,14vw,220px);
    height:clamp(100px,14vw,220px);
    border-radius:50%;
    opacity:0;
    animation:crackerBlast 2.6s ease-out infinite;
}
.cracker-blast::before,
.cracker-blast::after{
    content:"";
    position:absolute;
    inset:12%;
    border-radius:50%;
    background:
      radial-gradient(circle,#fff 0 2%,#ffd84d 3% 5%,transparent 6%),
      conic-gradient(
        from 0deg,
        transparent 0 6deg,#ffd84d 7deg 9deg,transparent 10deg 18deg,
        #ff6b35 19deg 21deg,transparent 22deg 35deg,
        #fff 36deg 38deg,transparent 39deg 50deg,
        #00dcff 51deg 53deg,transparent 54deg 70deg,
        #ffd84d 71deg 73deg,transparent 74deg 90deg,
        #ff3cac 91deg 93deg,transparent 94deg 110deg,
        #fff 111deg 113deg,transparent 114deg 130deg,
        #ffd84d 131deg 133deg,transparent 134deg 150deg,
        #00dcff 151deg 153deg,transparent 154deg 170deg,
        #ff6b35 171deg 173deg,transparent 174deg 190deg,
        #fff 191deg 193deg,transparent 194deg 210deg,
        #ffd84d 211deg 213deg,transparent 214deg 230deg,
        #ff3cac 231deg 233deg,transparent 234deg 250deg,
        #fff 251deg 253deg,transparent 254deg 270deg,
        #00dcff 271deg 273deg,transparent 274deg 290deg,
        #ffd84d 291deg 293deg,transparent 294deg 310deg,
        #ff6b35 311deg 313deg,transparent 314deg 330deg,
        #fff 331deg 333deg,transparent 334deg 360deg
      );
    filter:blur(.2px);
}
.cracker-blast::after{
    inset:30%;
    background:radial-gradient(circle,
        #fff 0 4%,
        #ffd84d 5% 13%,
        #ff6b35 14% 20%,
        transparent 21% 100%);
    box-shadow:0 0 25px 10px rgba(255,216,77,.65);
}
.cracker-blast.b1{left:0%;top:3%;animation-delay:0s}
.cracker-blast.b2{right:0%;top:8%;animation-delay:.9s}
.cracker-blast.b3{left:2%;bottom:0%;animation-delay:1.7s;transform:scale(.78)}
.cracker-blast.b4{right:2%;bottom:2%;animation-delay:2.3s;transform:scale(.78)}

@keyframes crackerBlast{
    0%{opacity:0;transform:scale(.25) rotate(0deg)}
    8%{opacity:1}
    38%{opacity:.95;transform:scale(.72) rotate(12deg)}
    68%{opacity:.65;transform:scale(1.08) rotate(-8deg)}
    100%{opacity:0;transform:scale(1.45) rotate(18deg)}
}


/* NO-BIRTHDAY QUOTE SCREEN */
.quote-screen{
    position:absolute;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vw;
    color:#fff;
}
.quote-screen.show{display:flex}
.quote-screen.show ~ .balloon,
.quote-screen.show ~ .cracker-layer,
.quote-screen.show ~ .cracker-blast-layer{
    display:none!important;
}
.screen.quote-active .balloon,
.screen.quote-active .cracker-layer,
.screen.quote-active .cracker-blast-layer{
    display:none!important;
}
.quote-text{
    width:min(90vw,1500px);
    font-size:clamp(28px,5vw,82px);
    line-height:1.15;
    font-weight:900;
    letter-spacing:clamp(1px,.35vw,6px);
    text-transform:uppercase;
    text-shadow:0 8px 35px rgba(0,0,0,.55);
    animation:quoteIn .8s ease;
}
.quote-author{
    display:block;
    margin-top:28px;
    font-size:clamp(14px,1.6vw,25px);
    line-height:1.2;
    font-weight:500;
    letter-spacing:1px;
    text-transform:none;
    text-transform:capitalize;
    opacity:.88;
}
@keyframes quoteIn{
    from{opacity:0;transform:scale(.94) translateY(18px)}
    to{opacity:1;transform:scale(1) translateY(0)}
}


/* Birthday / upcoming birthday sky fireworks */
#birthdayFireworks{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  display:none;
}
body.birthday-mode #birthdayFireworks{display:block}

.firework{
  position:absolute;
  left:var(--x);
  top:var(--y);
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 14px 5px #fff, 0 0 35px 12px #ffd166;
  animation:fireworkCore 2.2s ease-out infinite;
  animation-delay:var(--delay);
}
.firework::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:190px;
  height:190px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    linear-gradient(0deg,transparent 48%,#ffd166 49%,#fff 50%,#ffd166 51%,transparent 52%),
    linear-gradient(45deg,transparent 48%,#ff7b54 49%,#fff 50%,#ff7b54 51%,transparent 52%),
    linear-gradient(90deg,transparent 48%,#ffe066 49%,#fff 50%,#ffe066 51%,transparent 52%),
    linear-gradient(135deg,transparent 48%,#ff6b6b 49%,#fff 50%,#ff6b6b 51%,transparent 52%);
  opacity:0;
  animation:fireworkRays 2.2s ease-out infinite;
  animation-delay:var(--delay);
}
.firework::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:240px;
  height:240px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 0%,#fff 0 3px,transparent 4px),
    radial-gradient(circle at 85% 15%,#ffd166 0 3px,transparent 4px),
    radial-gradient(circle at 100% 50%,#ff7b54 0 3px,transparent 4px),
    radial-gradient(circle at 85% 85%,#ffe066 0 3px,transparent 4px),
    radial-gradient(circle at 50% 100%,#fff 0 3px,transparent 4px),
    radial-gradient(circle at 15% 85%,#ffd166 0 3px,transparent 4px),
    radial-gradient(circle at 0% 50%,#ff7b54 0 3px,transparent 4px),
    radial-gradient(circle at 15% 15%,#ffe066 0 3px,transparent 4px);
  opacity:0;
  animation:fireworkParticles 2.2s ease-out infinite;
  animation-delay:var(--delay);
}
@keyframes fireworkCore{
  0%,100%{transform:scale(.2);opacity:0}
  10%{transform:scale(1.4);opacity:1}
  25%{transform:scale(.9);opacity:1}
  60%{transform:scale(.55);opacity:.7}
  100%{transform:scale(.1);opacity:0}
}
@keyframes fireworkRays{
  0%,12%{transform:translate(-50%,-50%) scale(.05);opacity:0}
  22%{transform:translate(-50%,-50%) scale(.35);opacity:1}
  65%{transform:translate(-50%,-50%) scale(1);opacity:.8}
  100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}
}
@keyframes fireworkParticles{
  0%,15%{transform:translate(-50%,-50%) scale(.05);opacity:0}
  25%{transform:translate(-50%,-50%) scale(.3);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(1.45);opacity:0}
}

/* Continuous floating balloons: no sticks/strings, bottom -> top */
.balloon{
  animation:balloonFloatUp var(--balloon-duration, 12s) linear infinite;
  animation-delay:var(--balloon-delay, 0s);
}
@keyframes balloonFloatUp{
  0%{
    transform:translate3d(0,115vh,0) rotate(-5deg);
    opacity:0;
  }
  8%{opacity:.9}
  50%{
    transform:translate3d(var(--balloon-drift, 20px),45vh,0) rotate(5deg);
    opacity:.95;
  }
  92%{opacity:.85}
  100%{
    transform:translate3d(calc(var(--balloon-drift, 20px) * -1),-25vh,0) rotate(-4deg);
    opacity:0;
  }
}

/* Continuous birthday confetti */
#birthdayConfetti{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  overflow:hidden;
  display:none;
}
body.birthday-mode #birthdayConfetti{display:block}

.confetti{
  position:absolute;
  left:var(--cx);
  top:-8vh;
  width:var(--cw);
  height:var(--ch);
  border-radius:2px;
  background:var(--cc);
  opacity:.9;
  transform:rotate(var(--cr));
  animation:confettiFall var(--cd) linear infinite;
  animation-delay:var(--cdelay);
}
@keyframes confettiFall{
  0%{
    transform:translate3d(0,-12vh,0) rotate(var(--cr));
    opacity:0;
  }
  8%{opacity:1}
  50%{
    transform:translate3d(var(--sway),55vh,0) rotate(calc(var(--cr) + 180deg));
    opacity:.95;
  }
  100%{
    transform:translate3d(calc(var(--sway) * -1),115vh,0) rotate(calc(var(--cr) + 420deg));
    opacity:0;
  }
}
</style>

  <span class="confetti" style="--cx:74%;--cw:6px;--ch:11px;--cc:#ff6b6b;--cd:7.800000000000001s;--cdelay:-2.6s;--sway:-18px;--cr:251deg"></span>

function validBirthday(e){

}

function cleanName(name){
    return String(name||"")
        .replace(/[\\/:*?"<>|]/g,"")
        .replace(/\s+/g," ")
        .trim();
}

/* Find photos by employee name automatically. */
function photoCandidates(employee){
    const name = cleanName(employee.name);

    const extensions = [
        ".jpg",".jpeg",".png",".webp",
        ".JPG",".JPEG",".PNG",".WEBP"
    ];

    const variants = [...new Set([
        name,
        name.replace(/\./g,""),
        name.replace(/\s+/g,"_"),
        name.replace(/\s+/g,"-")
    ])];

    const candidates = [];

    if(employee.photo) candidates.push(employee.photo);

    variants.forEach(v=>{
        extensions.forEach(ext=>{
            candidates.push("./"+v+ext);
            candidates.push("./photos/"+v+ext);
        });
    });

    if(name.toLowerCase().includes("achyut")){
        candidates.push("./Achyut Pandurang Sirsat.jpg");
        candidates.push("./Achyut Sirsat.jpg");
        candidates.push("./photos/Achyut Pandurang Sirsat.jpg");
        candidates.push("./photos/Achyut Sirsat.jpg");
    }

    return [...new Set(candidates)];
}

/* Preload photos so the 1-hour change has no loading lag. */
const photoCache = new Map();

function preloadPhoto(employee){
    const key = cleanName(employee.name);

    if(photoCache.has(key)){
        return photoCache.get(key);
    }

    const promise = new Promise(resolve=>{
        const candidates = photoCandidates(employee);
        let index = 0;

        function next(){
            if(index >= candidates.length){
                resolve(null);
                return;
            }

            const image = new Image();
            const url = candidates[index++];

            image.onload = ()=>resolve(url);
            image.onerror = next;
            image.src = url;
        }

        next();
    });

    photoCache.set(key,promise);
    return promise;
}

/* Resize the frame according to the actual photo aspect ratio. */
function fitPhotoFrame(){
    const img = document.getElementById("employeePhoto");
    const frame = document.getElementById("photoFrame");

    if(!img.naturalWidth || !img.naturalHeight) return;

    const ratio = img.naturalWidth / img.naturalHeight;

    const landscape =
        window.innerWidth > window.innerHeight;

    const maxWidth = Math.min(
        window.innerWidth * (landscape ? .43 : .72),
        650
    );

    const maxHeight = Math.min(
        window.innerHeight * (landscape ? .67 : .40),
        700
    );

    let width = maxWidth;
    let height = width / ratio;

    if(height > maxHeight){
        height = maxHeight;
        width = height * ratio;
    }

    frame.style.width = Math.round(width) + "px";
    frame.style.height = Math.round(height) + "px";
}

function autoFitText(element, maxSize, minSize, availableWidth){
    if(!element) return;

    element.style.fontSize = maxSize + "px";

    let size = maxSize;
    while(size > minSize && element.scrollWidth > availableWidth){
        size -= 1;
        element.style.fontSize = size + "px";
    }

    // Never allow text to exceed the available width.
    element.style.maxWidth = Math.max(40, availableWidth) + "px";
}

function autoFitScreen(){
    const main = document.getElementById("main") || document.querySelector(".main");
    const details = document.getElementById("details");
    const status = document.getElementById("status");
    const name = document.getElementById("employeeName");
    const department = document.getElementById("department");
    const date = document.getElementById("birthdayDate");
    const frame = document.getElementById("photoFrame");

    if(!details) return;

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const landscape = vw >= vh;

    // Keep the complete main content inside the visible screen.
    if(main){
        main.style.maxWidth = Math.max(260, vw * 0.96) + "px";
        main.style.maxHeight = Math.max(220, vh * 0.92) + "px";
    }

    // Recalculate photo frame from actual image ratio when available.
    fitPhotoFrame();

    const detailsWidth = Math.max(
        160,
        Math.min(
            details.clientWidth || vw * (landscape ? 0.48 : 0.92),
            vw * (landscape ? 0.50 : 0.92)
        )
    );

    const statusMax = landscape
        ? Math.min(54, vw * 0.033)
        : Math.min(38, vw * 0.055);

    const nameMax = landscape
        ? Math.min(86, vw * 0.055)
        : Math.min(50, vw * 0.065);

    autoFitText(status, Math.max(16, statusMax), 12, detailsWidth);
    autoFitText(name, Math.max(18, nameMax), 12, detailsWidth);

    if(department){
        department.style.maxWidth = detailsWidth + "px";
        department.style.whiteSpace = "nowrap";
        department.style.overflow = "hidden";
        department.style.textOverflow = "ellipsis";
    }

    if(date){
        date.style.maxWidth = detailsWidth + "px";
        date.style.whiteSpace = "nowrap";
        date.style.overflow = "hidden";
        date.style.textOverflow = "ellipsis";
    }

    // On very short screens, reduce vertical spacing so everything remains visible.
    if(vh < 650){
        details.style.transform = "scale(" + Math.max(0.82, Math.min(1, vh / 650)) + ")";
        details.style.transformOrigin = "center center";
    }else{
        details.style.transform = "";
        details.style.transformOrigin = "";
    }
}

    name.textContent=employee.name || "Employee";
    department.textContent=employee.department || "";
    date.textContent="Birthday: "+birthdayDate(employee);

    details.classList.remove("change");
    void details.offsetWidth;
    details.classList.add("change");

    const imageURL=await preloadPhoto(employee);

    if(imageURL){
        img.style.opacity="0";

        img.onload=()=>{
            fitPhotoFrame();
            setTimeout(autoFitScreen, 50);

            img.style.animation="none";
            void img.offsetWidth;

            img.style.animation=
                `slowZoom ${PHOTO_ZOOM_SECONDS}s ease-in-out infinite alternate`;

            img.style.opacity="1";
        };

        img.src=imageURL;
    }else{
        img.removeAttribute("src");
        img.style.opacity="0";
    }

    celebration();
    setTimeout(autoFitScreen, 100);
}

/*
    CURRENT MONTH ONLY

    Example:
    If today is 22 September, only:
    22 September -> 30 September
    are shown.

    October birthdays are not shown until October starts.
*/
function getMonthlyQueue(){
    const now = new Date();
    const month = now.getMonth() + 1;
    const day = now.getDate();

    return employees
        .filter(e =>
            validBirthday(e) &&
            Number(e.month) === month &&
            Number(e.day) >= day
        )
        .sort((a,b) =>
            Number(a.day)-Number(b.day) ||
            String(a.name).localeCompare(String(b.name))
        );
}

/* If the current month has no remaining birthdays,
   find the next month containing birthdays. */
function getNextMonthQueue(){

    const now=new Date();

    let month=now.getMonth()+1;

    for(let i=0;i<12;i++){

        month++;

        if(month>12) month=1;

        const list=employees
            .filter(e =>
                validBirthday(e) &&
                Number(e.month)===month
            )
            .sort((a,b)=>
                Number(a.day)-Number(b.day) ||
                String(a.name).localeCompare(String(b.name))
            );

        if(list.length) return list;
    }

    return [];
}

let queue=[];
let queueIndex=0;
let timer=null;
let quoteHistory=[];

function getNextQuote(){
    if(!quotes.length) return null;

    // Do not repeat a quotation until every quotation has been shown once.
    let available=quotes.filter((_,index)=>!quoteHistory.includes(index));

    if(!available.length){
        quoteHistory=[];
        available=quotes.slice();
    }

    const quote=available[Math.floor(Math.random()*available.length)];
    const quoteIndex=quotes.indexOf(quote);
    quoteHistory.push(quoteIndex);

    return quote;
}

function showQuote(){
    const quoteScreen=document.getElementById("quoteScreen");
    const quoteText=document.getElementById("quoteText");
    const quoteAuthor=document.getElementById("quoteAuthor");
    const main=document.querySelector(".main");
    const quote=getNextQuote();

    if(!quote) return;

    if(main) main.style.display="none";
    document.getElementById("screen").classList.add("quote-active");
    quoteScreen.classList.add("show");
    quoteScreen.setAttribute("aria-hidden","false");

    quoteText.classList.remove("quote-text");
    void quoteText.offsetWidth;
    quoteText.classList.add("quote-text");

    quoteText.textContent=quote.text;
    const authorName=String(quote.author||"").trim();
    const hasKnownAuthor = authorName && authorName.toLowerCase() !== "unknown";
    const formattedAuthor=hasKnownAuthor
        ? authorName.charAt(0).toUpperCase()+authorName.slice(1)
        : "";
    quoteAuthor.textContent=hasKnownAuthor ? "— " + formattedAuthor : "";
    quoteAuthor.style.display=hasKnownAuthor ? "block" : "none";

    celebration();

    timer=setTimeout(()=>{
        quoteScreen.classList.remove("show");
        document.getElementById("screen").classList.remove("quote-active");
        quoteScreen.setAttribute("aria-hidden","true");
        if(main) main.style.display="";
        startUpcomingRotation();
    },QUOTE_DISPLAY_TIME);
}

function startUpcomingRotation(){
    if(timer){
        clearTimeout(timer);
        timer=null;
    }

    const now=new Date();
    const currentMonth=now.getMonth()+1;

    /*
       Show only the next upcoming birthday in the current month.
       Birthdays from other months are not shown in the upcoming rotation.
    */
    const upcomingThisMonth=employees
        .filter(e =>
            validBirthday(e) &&
            Number(e.month)===currentMonth &&
            Number(e.day)>now.getDate()
        )
        .sort((a,b)=>
            Number(a.day)-Number(b.day) ||
            String(a.name).localeCompare(String(b.name))
        );

    if(upcomingThisMonth.length){
        queue=upcomingThisMonth;
        queueIndex=0;
        playUpcomingNext();
    }else{
        // No more birthdays in this month.
        showQuote();
    }
}

function startMonthlyRotation(){
    if(timer){
        clearTimeout(timer);
        timer=null;
    }

    const now=new Date();
    const todayBirthdays=employees
        .filter(e =>
            validBirthday(e) &&
            Number(e.month)===now.getMonth()+1 &&
            Number(e.day)===now.getDate()
        )
        .sort((a,b)=>String(a.name).localeCompare(String(b.name)));

    /*
       If one or more birthdays are today:
       - Show each birthday user for 10 minutes.
       - After all today's birthdays, show the next upcoming birthday for 10 seconds.
       - Do not show quotations while today's birthday(s) exist.
    */
    if(todayBirthdays.length){
        queue=todayBirthdays;
        queueIndex=0;
        playNext();
        return;
    }

    /*
       No birthday today:
       show a non-repeating quotation for 10 minutes,
       then continue with upcoming birthdays for 10 seconds each.
    */
    showQuote();
}

function playUpcomingNext(){
    if(!queue.length){
        showQuote();
        return;
    }

    const employee=queue[queueIndex];

    /* RAVIKIRAN UPPALAPATI alone gets a 10-minute upcoming-birthday hold. */
    showEmployee(employee, false);

    const nextIndex=(queueIndex+1)%queue.length;
    preloadPhoto(queue[nextIndex]);

    timer=setTimeout(()=>{
        queueIndex++;
        if(queueIndex>=queue.length){
            // After the upcoming preview cycle, return to the normal quote/upcoming flow.
            startMonthlyRotation();
        }else{
            playUpcomingNext();
        }
    }, String(employee.name || "").trim().toUpperCase() === "RAVIKIRAN UPPALAPATI"
        ? RAVIKIRAN_UPCOMING_DISPLAY_TIME
        : UPCOMING_DISPLAY_TIME);
}

function playNext(){
    if(!queue.length){
        startMonthlyRotation();
        return;
    }

    const employee=queue[queueIndex];
    const now=new Date();

    // A user whose birthday is today stays for 10 minutes.
    // Future birthdays in the current month are previewed for 10 seconds.
    const isTodayBirthday =
        Number(employee.month) === now.getMonth()+1 &&
        Number(employee.day) === now.getDate();

    showEmployee(employee, isTodayBirthday);

    // Preload next photo while current user is displayed.
    const nextIndex=(queueIndex+1)%queue.length;
    preloadPhoto(queue[nextIndex]);

    const holdTime = isTodayBirthday
        ? BIRTHDAY_DISPLAY_TIME
        : UPCOMING_DISPLAY_TIME;

    timer=setTimeout(()=>{
        queueIndex++;

        if(queueIndex>=queue.length){
            // Today's birthdays are finished; show upcoming birthdays for 10 seconds.
            startUpcomingRotation();
        }else{
            playNext();
        }
    },holdTime);
}

/* Check the date every 30 seconds. */
let lastDate=new Date().toDateString();

setInterval(()=>{

    const today=new Date().toDateString();

    if(today!==lastDate){
        lastDate=today;
        startMonthlyRotation();
    }

},30000);

/* Start */
startMonthlyRotation();
setTimeout(autoFitScreen, 250);

/* Double-click for browser full screen. */
document.addEventListener("dblclick",()=>{
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen().catch(()=>{});
    }
});

/* Auto-fit/full-screen helper for TV, laptop and browser displays. */
function tryAutoFullscreen(){
    if(!document.fullscreenElement && document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen().catch(()=>{});
    }
}
window.addEventListener("load",()=>setTimeout(tryAutoFullscreen,1200),{once:true});
