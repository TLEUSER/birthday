<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday! - Preview</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background: radial-gradient(circle at 30% 20%, #4a9b8e 0%, #2d6e7e 35%, #1a3f5c 70%, #0f2a44 100%);

            color: white;
            text-align: center;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 100px 30px 30px;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 30px;
            height: 60px;
        }

        .logo img {
            height: 100%;
            object-fit: contain;
        }

        .title {
            font-size: clamp(40px, 6vw, 90px);
            font-weight: bold;
            color: #fff;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: bounce 2s infinite;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: clamp(20px, 3vw, 40px);
            margin-bottom: 25px;
        }

        .photo {
            width: min(400px, 40vw);
            height: min(400px, 40vw);
            min-width: 260px;
            min-height: 260px;

            object-fit: cover;
            object-position: center 10%;

            border-radius: 50%;
            border: 12px solid white;

            box-shadow:
                0 0 30px rgba(255,255,255,0.8),
                0 15px 40px rgba(0,0,0,0.35);

            animation: glow 2s infinite alternate;
            margin-bottom: 25px;
        }

        .name {
            font-size: clamp(35px, 5vw, 70px);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .department {
            font-size: clamp(18px, 2.5vw, 32px);
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .message {
            max-width: 1000px;
            font-size: clamp(20px, 2.5vw, 36px);
            line-height: 1.5;
            background: rgba(255,255,255,0.15);
            padding: 20px 35px;
            border-radius: 25px;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .cake {
            font-size: clamp(35px, 5vw, 65px);
            margin-top: 20px;
        }

        /* Party poppers - continuously rising */

        .balloon {
            position: fixed;
            bottom: -120px;
            font-size: 60px;
            opacity: 0.95;
            animation: floatUp linear infinite;
            z-index: 5;
            pointer-events: none;
        }

        .balloon8  { left: 10%; font-size: 30px; animation-duration: 8s;  animation-delay: 1.5s; }
        .balloon9  { left: 38%; font-size: 26px; animation-duration: 10s; animation-delay: 3.5s; }
        .balloon10 { left: 58%; font-size: 32px; animation-duration: 7.5s; animation-delay: 2.2s; }
        .balloon11 { left: 82%; font-size: 28px; animation-duration: 9.5s; animation-delay: 4.5s; }
        .balloon12 { left: 95%; font-size: 30px; animation-duration: 8.5s; animation-delay: 0.8s; }

        /* Party popper blast - repeating confetti burst across the whole screen */

        .confetti-piece {
            position: fixed;
            top: 0;
            left: var(--startX);
            width: 10px;
            height: 16px;
            background: var(--pcolor);
            opacity: 0;
            z-index: 6;
            pointer-events: none;
            animation: blast 4s ease-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes blast {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            6% {
                opacity: 1;
            }
            40% {
                transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
                opacity: 0;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
                opacity: 0;
            }
        }

        /* Animations */

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes glow {
            from {
                box-shadow:
                    0 0 20px rgba(255,255,255,0.6),
                    0 15px 40px rgba(0,0,0,0.3);
            }
            to {
                box-shadow:
                    0 0 45px rgba(255,255,255,1),
                    0 15px 40px rgba(0,0,0,0.3);
            }
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.95;
            }
            50% {
                transform: translateY(-55vh) translateX(25px) rotate(8deg);
            }
            100% {
                transform: translateY(-115vh) translateX(-20px) rotate(-6deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .container { padding: 80px 15px 15px; }
            .logo { height: 36px; top: 12px; left: 16px; }
            .photo { width: 260px; height: 260px; }
            .message { padding: 15px; }

        }
    </style>
</head>
