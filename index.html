<title>Birthday TV Display - Auto Photo Fit</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;min-width:100%;min-height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;text-align:center;background:radial-gradient(circle at 30% 20%,#4a9b8e 0%,#2d6e7e 35%,#1a3f5c 70%,#0f2a44 100%)}
.container{width:100vw;height:100vh;height:100dvh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,.35vh,8px);position:relative;padding:clamp(6px,1vh,16px) clamp(8px,2vw,30px);z-index:5;overflow:hidden}
.logo{position:fixed;top:clamp(12px,2vh,28px);left:clamp(14px,2vw,32px);height:clamp(34px,5vh,70px);max-width:22vw;z-index:20}
.logo img{height:100%;max-width:100%;object-fit:cover;display:block}
.title{font-size:clamp(28px,5.2vw,82px);font-weight:bold;line-height:1.05;text-shadow:0 5px 15px rgba(0,0,0,.3);animation:bounce 2s infinite}
.subtitle{font-size:clamp(16px,2.4vw,34px);line-height:1.15}
.date{font-size:clamp(14px,1.8vw,26px);font-weight:bold;line-height:1.1;opacity:.95}
.photo-wrap{
  width:min(74vw,74vh,1100px);
  height:min(74vw,74vh,1100px);
  max-width:74vw;
  max-height:74vh;
  min-width:160px;
  min-height:160px;
  border-radius:20px;
  padding:clamp(4px,.6vw,9px);
  background:linear-gradient(#fff,#fff) padding-box,
             linear-gradient(135deg,#fff,#f7d774,#c99a22,#fff,#e8bd45) border-box;
  border:5px solid transparent;
  box-shadow:0 0 22px rgba(255,215,100,.75),0 0 45px rgba(255,255,255,.7),0 14px 40px rgba(0,0,0,.38);
  overflow:hidden;
  animation:glow 2s infinite alternate;
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
}
.photo-inner{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  border-radius:16px;
  display:block;
  background:#142f3d;
  transform:scale(1);
  transform-origin:center center;
  animation:faceZoom 14s ease-in-out infinite alternate;
  will-change:transform;
}
.fallback{
  width:100%;
  height:100%;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(46px,8vw,130px);
  font-weight:bold;
  background:rgba(255,255,255,.18)
}
@keyframes faceZoom{
  0%{transform:scale(1)}
  100%{transform:scale(1.10)}
}
.name{max-width:90vw;font-size:clamp(26px,4.5vw,68px);font-weight:bold;line-height:1.05;text-shadow:0 4px 10px rgba(0,0,0,.25);overflow-wrap:anywhere}
.department{font-size:clamp(15px,2.2vw,30px);line-height:1.1;opacity:.9}
.message{max-width:min(1000px,88vw);font-size:clamp(14px,1.8vw,28px);line-height:1.3;background:rgba(255,255,255,.15);padding:clamp(8px,1.3vh,16px) clamp(14px,2vw,30px);border-radius:25px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
.nav{display:none}
.confetti-piece{position:fixed;top:0;left:var(--startX);width:10px;height:16px;background:var(--pcolor);opacity:0;z-index:1;pointer-events:none;animation:blast 4s ease-out infinite;animation-delay:var(--delay)}
.balloon{position:fixed;bottom:-120px;font-size:60px;opacity:.95;animation:floatUp linear infinite;z-index:1;pointer-events:none}
.blast{position:fixed;width:0;height:0;z-index:10;pointer-events:none}.blast span{position:absolute;left:0;top:0;width:8px;height:22px;border-radius:3px;background:var(--c);opacity:0;transform-origin:center bottom;animation:blastOut 2.8s ease-out infinite;animation-delay:var(--delay)}.blast.left{left:8%;top:52%}.blast.right{right:8%;top:52%}.blast.left span{--origin:1}.blast.right span{--origin:-1}
@keyframes blast{0%{transform:translate(0,0) rotate(0deg);opacity:1}6%{opacity:1}40%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{from{box-shadow:0 0 20px rgba(255,255,255,.6),0 15px 40px rgba(0,0,0,.3)}to{box-shadow:0 0 45px rgba(255,255,255,1),0 15px 40px rgba(0,0,0,.3)}}
@keyframes floatUp{0%{transform:translateY(0) translateX(0) rotate(0);opacity:.95}50%{transform:translateY(-55vh) translateX(25px) rotate(8deg)}100%{transform:translateY(-115vh) translateX(-20px) rotate(-6deg);opacity:0}}
@keyframes blastOut{0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.4)}8%,55%{opacity:1}100%{opacity:0;transform:translate(calc(var(--x) * var(--origin)),var(--y)) rotate(var(--r)) scale(1)}}

/* UNIVERSAL AUTO-FIT: TV, laptop, tablet and mobile */
:root{
  --safe-w: 96vw;
  --safe-h: 96vh;
}
html,body{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
}
body{
  overflow:hidden;
}
.container{
  width:100%;
  height:100%;
  height:100dvh;
  min-height:0;
  padding:
    clamp(4px,1.2vh,18px)
    clamp(5px,1.5vw,24px);
  gap:clamp(2px,.55vh,10px);
}
.title{
  max-width:96vw;
  font-size:clamp(22px,5.2vmin,82px);
}
.subtitle{
  max-width:94vw;
  font-size:clamp(13px,2.6vmin,34px);
}
.date{
  max-width:94vw;
  font-size:clamp(11px,2vmin,26px);
}
.name{
  max-width:96vw;
  font-size:clamp(20px,4.6vmin,68px);
}
.department{
  max-width:94vw;
  font-size:clamp(12px,2.5vmin,30px);
}
.message{
  max-width:92vw;
  max-height:18vh;
  overflow:hidden;
  font-size:clamp(11px,1.9vmin,28px);
  padding:clamp(5px,1vh,14px) clamp(10px,1.8vw,26px);
}

/* The JavaScript chooses the frame dimensions from the actual photo aspect ratio.
   These values are only the initial safe fallback before the image loads. */
.photo-wrap{
  width:min(74vw,74vh,1100px);
  height:min(74vw,74vh,1100px);
  max-width:78vw;
  max-height:62vh;
  min-width:110px;
  min-height:110px;
  flex-shrink:1;
}
.photo-inner{
  max-width:100%;
  max-height:100%;
}

/* Portrait phones */
@media (max-width:600px){
  .container{
    padding:clamp(42px,8vh,70px) 8px 8px;
    gap:clamp(2px,.7vh,7px);
  }
  .logo{
    top:8px;
    left:10px;
    height:clamp(25px,5vh,38px);
  }
  .photo-wrap{
    max-width:92vw;
    max-height:48vh;
    min-width:130px;
    min-height:130px;
  }
  .message{
    max-width:94vw;
    max-height:15vh;
  }
}

/* Short/wide screens and landscape phones */
@media (orientation:landscape) and (max-height:600px){
  .container{
    padding:4px 8px;
    gap:2px;
  }
  .logo{
    top:5px;
    left:8px;
    height:28px;
  }
  .title{font-size:clamp(18px,5vw,48px)}
  .photo-wrap{
    max-width:48vw;
    max-height:52vh;
    min-width:100px;
    min-height:100px;
  }
  .name{font-size:clamp(18px,4vw,42px)}
  .department{font-size:clamp(11px,2vw,20px)}
  .message{
    max-height:13vh;
    font-size:clamp(10px,1.5vw,18px);
    padding:4px 10px;
  }
}

/* Very small laptop/TV browser windows */
@media (max-height:500px){
  .container{
    padding:3px 6px;
    gap:1px;
  }
  .photo-wrap{
    max-height:50vh;
  }
  .message{
    display:none;
  }
}

/* High-resolution / large TV displays */
@media (min-width:1800px) and (min-height:900px){
  .photo-wrap{
    max-width:76vw;
    max-height:64vh;
  }
}

/* Avoid horizontal/vertical scrolling on every device. */
img{
  max-width:100%;
}

@media (max-height:700px){.container{gap:2px;padding-top:10px;padding-bottom:10px}.title{font-size:clamp(24px,4.5vw,58px)}.subtitle{font-size:clamp(13px,2vw,24px)}.date{font-size:clamp(12px,1.5vw,20px)}.photo-wrap{width:min(48vw,43vh,500px);height:min(48vw,43vh,500px)}.name{font-size:clamp(22px,3.8vw,48px)}.department{font-size:clamp(13px,1.8vw,22px)}.message{font-size:clamp(12px,1.45vw,20px);padding:7px 16px}}
@media (max-width:600px){.container{padding:70px 12px 12px;justify-content:center}.logo{top:12px;left:14px;height:32px}.photo-wrap{width:min(88vw,42vh);height:min(88vw,42vh);min-width:180px;min-height:180px}.message{max-width:94vw}.title{font-size:clamp(26px,9vw,48px)}.name{font-size:clamp(24px,8vw,44px)}}

function todayMatches(rec) {
  const now = new Date();
  return Number(rec.day) === now.getDate() && Number(rec.month) === now.getMonth() + 1;
}
function displayDate(rec) {
  if (!rec || !rec.day || !rec.month) return '';
  return `${String(rec.day).padStart(2,'0')}/${String(rec.month).padStart(2,'0')}`;
}
function initials(name) {
  return String(name||'Employee').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
}

function fitPhotoFrameToImage() {
  const img = document.getElementById('employeePhoto');
  const frame = document.querySelector('.photo-wrap');
  if (!img || !frame || !img.naturalWidth || !img.naturalHeight) return;

  const ratio = img.naturalWidth / img.naturalHeight;

  // Keep the complete photo visible, but never let the frame exceed
  // the TV-safe area reserved for the photo.
  const isMobile = window.innerWidth <= 600;
  const isLandscapeShort = window.innerWidth > window.innerHeight && window.innerHeight <= 600;

  const maxW = Math.min(
    window.innerWidth * (isMobile ? 0.92 : isLandscapeShort ? 0.48 : 0.76),
    1100
  );
  const maxH = Math.min(
    window.innerHeight * (isMobile ? 0.48 : isLandscapeShort ? 0.52 : 0.64),
    900
  );

  let width = maxW;
  let height = width / ratio;

  if (height > maxH) {
    height = maxH;
    width = height * ratio;
  }

  frame.style.width = `${Math.round(width)}px`;
  frame.style.height = `${Math.round(height)}px`;
}

window.addEventListener('resize', fitPhotoFrameToImage);

function show(rec, isToday = false) {
  const title = document.getElementById('birthdayTitle');
  const subtitle = document.getElementById('birthdaySubtitle');

  if (isToday) {
    title.textContent = '🎉 HAPPY BIRTHDAY! 🎉';
    subtitle.textContent = 'Wishing you a wonderful day!';
  } else {
    title.textContent = '🎊 COMING BIRTHDAY 🎊';
    subtitle.textContent = '';
  }

  document.getElementById('employeeName').textContent = rec.name || 'Employee';
  document.getElementById('department').textContent = rec.department || '';

  // Show the employee's complete birthday at the bottom.
  document.getElementById('birthdayDate').textContent =
    (rec.day && rec.month)
      ? `Birthday: ${new Date(new Date().getFullYear(), Number(rec.month)-1, Number(rec.day)).toLocaleDateString('en-IN', {
          day: '2-digit',
          month: 'long',
          year: 'numeric'
        })}`
      : '';

  const img = document.getElementById('employeePhoto');
  const fb = document.getElementById('fallback');
  fb.textContent = initials(rec.name);

  // Automatically find the employee photo from the employee name.
  // GitHub Pages cannot list a folder, so we try predictable filename variants.
  const employeeName = String(rec.name || '').trim();
  const extensions = ['.jpg', '.jpeg', '.png', '.webp', '.JPG', '.JPEG', '.PNG', '.WEBP'];
  const candidates = [];

  if (rec.photo) candidates.push(rec.photo);

  const clean = employeeName
    .replace(/[\\/:*?"<>|]/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  const variants = [...new Set([
    clean,
    clean.replace(/\./g, ''),
    clean.replace(/[.\s]+$/g, ''),
    clean.replace(/\s+/g, '_'),
    clean.replace(/\s+/g, '-')
  ])];

  for (const variant of variants) {
    for (const ext of extensions) {
      candidates.push('./' + variant + ext);
      candidates.push('./photos/' + variant + ext);
    }
  }

  // Achyut has appeared under both the old and full employee-name filenames.
  if (employeeName.toLowerCase().includes('achyut')) {
    [
      'Achyut Pandurang Sirsat.jpg',
      'Achyut Sirsat.jpg',
      'Achyut%20Pandurang%20Sirsat.jpg',
      'Achyut%20Sirsat.jpg',
      './photos/Achyut Pandurang Sirsat.jpg',
      './photos/Achyut Sirsat.jpg',
      './photos/Achyut%20Pandurang%20Sirsat.jpg',
      './photos/Achyut%20Sirsat.jpg'
    ].forEach(x => candidates.push(x.startsWith('./') ? x : './' + x));
  }

  const uniqueCandidates = [...new Set(candidates)];

  img.style.display = 'none';
  fb.style.display = 'flex';
  img.removeAttribute('src');

  // Restart the slow zoom for every employee.
  img.style.animation = 'none';
  void img.offsetWidth;
  img.style.animation = 'faceZoom 14s ease-in-out infinite alternate';

  let photoIndex = 0;

  function tryNextPhoto() {
    if (photoIndex >= uniqueCandidates.length) {
      img.style.display = 'none';
      fb.style.display = 'flex';
      const frame = document.querySelector('.photo-wrap');
      frame.style.width = 'min(68vw,68vh,900px)';
      frame.style.height = 'min(68vw,68vh,900px)';
      return;
    }

    const imageURL = uniqueCandidates[photoIndex++];

    img.onload = function () {
      img.style.display = 'block';
      fb.style.display = 'none';
      fitPhotoFrameToImage();
    };

    img.onerror = function () {
      tryNextPhoto();
    };

    img.src = imageURL;
  }

  tryNextPhoto();
}

function run() {
  let timer = null;
  let generation = 0;

  function clearTimer() {
    if (timer) {
      clearTimeout(timer);
      timer = null;
    }
  }

  function todayRecords() {
    const now = new Date();
    return employees.filter(r =>
      Number(r.day) === now.getDate() &&
      Number(r.month) === now.getMonth() + 1
    );
  }

  function upcomingRecords() {
    const now = new Date();
    const month = now.getMonth() + 1;
    const day = now.getDate();

    // Show the rest of this month first.
    const sameMonth = employees
      .filter(r => Number(r.month) === month && Number(r.day) > day)
      .sort((a,b) => Number(a.day)-Number(b.day) ||
                     String(a.name).localeCompare(String(b.name)));

    // Then continue from January for a complete yearly rotation.
    const laterYear = employees
      .filter(r => Number(r.month) !== month &&
                   (Number(r.month) > month || Number(r.month) < month))
      .sort((a,b) => {
        const am = Number(a.month), bm = Number(b.month);
        const ad = Number(a.day), bd = Number(b.day);
        const ak = am > month ? am : am + 12;
        const bk = bm > month ? bm : bm + 12;
        return ak-bk || ad-bd || String(a.name).localeCompare(String(b.name));
      });

    return [...sameMonth, ...laterYear];
  }

  function showUpcoming(list, myGeneration) {
    let index = 0;

    function next() {
      if (myGeneration !== generation) return;

      if (index < list.length) {
        show(list[index], false);
        index++;
        timer = setTimeout(next, 10000);
        return;
      }

      // After the full upcoming rotation, return to today's birthday
      // for 15 minutes, if there is a birthday today.
      const today = todayRecords();
      if (today.length) {
        show(today[0], true);
        timer = setTimeout(startCycle, 15 * 60 * 1000);
      } else {
        // No birthday today: restart the upcoming rotation.
        timer = setTimeout(startCycle, 1000);
      }
    }

    next();
  }

  function startCycle() {
    clearTimer();
    generation++;
    const myGeneration = generation;
    const today = todayRecords();

    if (today.length) {
      // Birthday employee stays for 15 minutes.
      show(today[0], true);
      timer = setTimeout(() => {
        if (myGeneration !== generation) return;
        showUpcoming(upcomingRecords(), myGeneration);
      }, 15 * 60 * 1000);
    } else {
      // No birthday today: show upcoming birthdays immediately.
      showUpcoming(upcomingRecords(), myGeneration);
    }
  }

  startCycle();
}

// Start birthday display.
run();

// Fully automatic midnight synchronization.
// Checks the computer date every 30 seconds. If the date changes,
// the page reloads and immediately rebuilds the birthday queue for the new day.
let lastDateKey = new Date().toDateString();
setInterval(() => {
  const currentDateKey = new Date().toDateString();
  if (currentDateKey !== lastDateKey) {
    window.location.reload();
  }
}, 30000);

// Extra safeguard: schedule a reload shortly after the next local midnight.
function scheduleMidnightSync() {
  const now = new Date();
  const nextMidnight = new Date(now);
  nextMidnight.setHours(24, 0, 2, 0); // 2 seconds after midnight
  const delay = nextMidnight.getTime() - now.getTime();
  setTimeout(() => window.location.reload(), delay);
}
scheduleMidnightSync();
